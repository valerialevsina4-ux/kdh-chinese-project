<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Study Cards</title>

    <link rel="stylesheet"
    href="style.css">

</head>

<body>

    <header class="page-header">

        <h1>Study Cards</h1>

        <p>
            Practice your Chinese vocabulary
            with interactive flashcards.
        </p>

    </header>

    <main class="study-page">

        <button class="start-button">

            Start 

        </button>

    </main>

     <div class="deck-overlay">

            <div class="deck-window">

                <h2>
                    Choose a Deck 
                </h2>

                <button>
                    Everyday Life
                </button>

                <button>
                    Character Vocabulary 
                </button>

                <button>
                    Songs Vocabulary 
                </button>

                <button>
                    Korean Culture
                </button>

                <button>
                    Mixed Deck 
                </button>

            </div>

        </div>

         <div class="flashcard-overlay">

            <button class="close">
                ✕
            </button>

            <div class="progress">

            </div>

            <button class="left-arrow">
                ❮
            </button>

            <div class="flashcard">

                <div class="card-front">

                    <img src="Tiger.jpg">

                    <h2>老虎</h2>

                </div>

                <div class="card-back">

                    <h2>lǎohǔ</h2>

                    <p>Tiger</p>

                </div>

            </div>

            <button class="right-arrow">
                ❯
            </button>

        </div>

    <footer>

        <p>
            K-pop Demon Hunters and related characters belong to their respective owners.
            This is a non-commercial fan-made educational project.
        </p>
        
    </footer>

</body>

</html>
